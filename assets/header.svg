<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Rupam Biswas — Full-Stack Developer. I debug prod so you can sleep through the night.">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#14171c" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="85%" cy="10%" r="60%">
      <stop offset="0" stop-color="#c8f53c" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#c8f53c" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
      .sans{font-family:'Bricolage Grotesque','Segoe UI',Helvetica,Arial,sans-serif}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
      .cursor{animation:blink 1.1s steps(1) infinite}
      .dot{animation:pulse 2s ease-in-out infinite}
    </style>
  </defs>

  <rect width="900" height="300" rx="16" fill="#08090b"/>
  <rect width="900" height="300" rx="16" fill="url(#grid)"/>
  <rect width="900" height="300" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="899" height="299" rx="15.5" fill="none" stroke="#1d2128"/>

  <!-- status pill -->
  <g transform="translate(48 44)">
    <rect width="318" height="28" rx="14" fill="#0f1115" stroke="#1d2128"/>
    <circle class="dot" cx="16" cy="14" r="4" fill="#c8f53c"/>
    <text x="28" y="18.5" class="mono" font-size="12" fill="#8a909c">Online · Bangalore, India · open to roles</text>
  </g>

  <!-- headline -->
  <text x="48" y="134" class="sans" font-size="44" font-weight="700" fill="#e9ebef">I debug <tspan fill="#c8f53c">prod</tspan> so you can sleep</text>
  <text x="48" y="182" class="sans" font-size="44" font-weight="700" fill="#e9ebef">through the night.</text>

  <!-- prompt line -->
  <text x="48" y="238" class="mono" font-size="15" fill="#8a909c"><tspan fill="#c8f53c">➜</tspan> <tspan fill="#67e3ff">~</tspan> whoami  <tspan fill="#e9ebef">Rupam Biswas · Full-Stack Developer</tspan> <tspan fill="#8a909c">// Next.js · Spring Boot · AWS</tspan> <tspan class="cursor" fill="#c8f53c">▌</tspan></text>

  <text x="48" y="270" class="mono" font-size="12" fill="#4a505b">rupam@prod:~$ uptime  →  2+ yrs in production · 400+ DSA · very few rollbacks</text>
</svg>
